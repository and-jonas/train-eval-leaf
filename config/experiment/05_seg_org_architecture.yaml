# @package _global_

defaults:
  - /model: organs
  - /optimization: seg_organ
  - /data_augmentation: base
  - /dataset: base
  - /sweep: architecture_comparison_organs
  - override /hydra/launcher: submitit_slurm
  - _self_

task: organs
run_name: architecture_comparison_organs
seed: 42
fold: null

optimization:
  epochs: 150
  early_stopping:
    enabled: true

hydra:
  mode: MULTIRUN
  launcher:
    partition: gpu
    gpus_per_node: 1
    cpus_per_task: 4
    mem_gb: 32
    timeout_min: 900
    array_parallelism: 3